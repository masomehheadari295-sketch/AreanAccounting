<link rel="stylesheet" href="/css/print.css" media="print">

<div id="app" class="app">
  <div class="bg-decor" aria-hidden="true"></div>

  <header id="appbar" class="appbar">
    <button class="icon-btn" id="btn-menu" aria-label="منوی بخش‌ها" aria-expanded="false">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <button class="icon-btn ghost-only" id="btn-back" aria-label="بازگشت" hidden>
      <svg class="ic"><use href="#i-back"/></svg>
    </button>
    <div class="appbar-title">
      <h1 id="page-title">خانه</h1>
      <p id="page-sub"></p>
    </div>
    <button class="icon-btn" id="btn-theme" aria-label="تغییر روشن/تیره">
      <svg class="ic"><use href="#i-moon" id="theme-icon"/></svg>
    </button>
    <button class="icon-btn" id="btn-search" aria-label="جست‌وجو">
      <svg class="ic"><use href="#i-search"/></svg>
    </button>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="همهٔ بخش‌ها">
    <div class="drawer-head">
      <div>
        <h2 id="biz-name">کسب‌وکار من</h2>
        <p id="biz-date" class="muted small"></p>
      </div>
      <button class="icon-btn" id="btn-drawer-close" aria-label="بستن منو">
        <svg class="ic"><use href="#i-close"/></svg>
      </button>
    </div>
    <nav id="drawer-nav" class="drawer-nav" aria-label="فهرست بخش‌ها"></nav>
    <div class="drawer-foot">
      <button class="btn btn-soft wide" id="btn-install" hidden>
        <svg class="ic"><use href="#i-download"/></svg> افزودن به صفحهٔ موبایل
      </button>
      <div class="statusline">
        <span id="conn-chip" class="chip" title="وضعیت اتصال">
          <svg class="ic"><use href="#i-check"/></svg> <b id="conn-text">متصل</b>
        </span>
        <span class="chip" id="version-chip">نسخه ۱</span>
      </div>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="بخش‌های پرکاربرد"></nav>

  <button id="fab" class="fab" aria-label="کارهای سریع">
    <svg class="ic"><use href="#i-plus"/></svg>
  </button>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="layers"></div>

<script type="module" src="/js/app.js"></script>
<noscript>برای دیدن این برنامه باید JavaScript روشن باشد.</noscript>
</body>
</html>
